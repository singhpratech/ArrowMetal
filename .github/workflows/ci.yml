name: CI
# GitHub's hosted Apple silicon runners expose an "Apple Paravirtual device": the GPU is virtual, so the
# correctness tests skip there (requireRealGPU()) and this job proves the build, the interop and the CPU
# paths only. The bench step below runs on that virtual device and its numbers are never published --
# every benchmark table in the repository was measured on real Apple silicon. Real GPU testing happens
# locally; the job runs on pull requests and by hand rather than on every push.
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - run: swift build
      - run: system_profiler SPDisplaysDataType | grep -E 'Chipset|Vendor|Metal' || true
      - run: ARROWMETAL_DEBUG_SHADERS=1 swift test
      - run: swift test -c release
      - run: swift run -c release arrowmetal-bench 2000000 2
