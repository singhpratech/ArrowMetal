name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift test -c release
      - run: swift run -c release arrowmetal-bench 2000000 2
