name: CI
# Hosted runners expose a virtual GPU (correctness tests skip there) and macOS minutes are billed on a
# private repo, so CI runs only on pull requests or by hand. Real GPU testing happens on Apple silicon locally.
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - run: swift build
      - run: system_profiler SPDisplaysDataType | grep -E 'Chipset|Vendor|Metal' || true
      - run: ARROWMETAL_DEBUG_SHADERS=1 swift test
      - run: swift test -c release
      - run: swift run -c release arrowmetal-bench 2000000 2
