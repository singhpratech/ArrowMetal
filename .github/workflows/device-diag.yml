name: device-diag
# Reports what the runner's Metal device builds (Tests/ArrowMetalTests/DeviceDiagnosticTests.swift): each selection
# runs in a fresh process, so a failure cannot affect the next one.
on:
  workflow_dispatch:
jobs:
  device-diag:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Build
        run: |
          set -o pipefail
          swift build -c release --build-tests -Xswiftc -enable-testing 2>&1 | grep -E "error:|Build complete" | tail -5
      - name: One selection per process
        run: |
          for sel in radix-uint radix-nospan radix-nohist tg-atomic-or shift64 radix-current; do
            echo "=== $sel"
            ARROWMETAL_DEVICE_DIAG=1 ARROWMETAL_DIAG_ONLY="$sel" swift test -c release --skip-build --filter DeviceDiagnosticTests 2>&1 | grep -E "DIAG:" || true
          done
