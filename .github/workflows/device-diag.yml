name: device-diag
# Reports which kernel variants the runner's Metal device builds (Tests/ArrowMetalTests/DeviceDiagnosticTests.swift).
on:
  workflow_dispatch:
jobs:
  device-diag:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - name: Build the tests
        run: swift build -c release --build-tests 2>&1 | grep -E "error:|warning: unre|Compiling|Build complete" | tail -40; test "${PIPESTATUS[0]}" = 0
      - name: Device diagnostic
        run: ARROWMETAL_DEVICE_DIAG=1 swift test -c release --skip-build --filter DeviceDiagnosticTests 2>&1 | grep -E "DIAG:|error:|Executed" | head -80
