name: device-diag
# Reports which kernel variants the runner's Metal device builds (Tests/ArrowMetalTests/DeviceDiagnosticTests.swift).
on:
  workflow_dispatch:
jobs:
  device-diag:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - name: Device diagnostic (builds the test target; fails on a compile error)
        run: |
          set -o pipefail
          ARROWMETAL_DEVICE_DIAG=1 swift test -c release --filter DeviceDiagnosticTests 2>&1 | grep -E "DIAG:|error:|Executed|Build complete" | head -80
