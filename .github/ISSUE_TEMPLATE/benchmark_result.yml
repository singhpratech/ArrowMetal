name: Benchmark result
description: Timings from `python -m arrowmetal.bench` on your Mac
title: "bench: "
labels: ["benchmark result"]
body:
  - type: markdown
    attributes:
      value: |
        Run `python -m arrowmetal.bench` (add `--calibrate` to also write this Mac's router table) and paste the
        Share it block it prints. The prefilled link the command prints fills in the first three fields.
  - type: textarea
    id: share
    attributes:
      label: Share it block
      description: Everything from `ArrowMetal bench result` to the last table row, fences included, exactly as the command printed it.
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      description: The `chip:` line of the block.
      placeholder: Apple M2 Pro
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      description: The `macOS:` line of the block.
      placeholder: macOS 15.6
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual about the machine or the run
      description: Other work running, low power mode, a virtual machine, a non-default `--rows`, the kind of file behind a `--parquet` run. A router table written by `--calibrate` (the `router table:` line names the file) can be attached here.
    validations:
      required: false
