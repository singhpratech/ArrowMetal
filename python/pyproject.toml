[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrowmetal"
# Single source of truth: `__version__` in arrowmetal/__init__.py. Nothing else states a version.
dynamic = ["version"]
description = "Apache Arrow columnar data on Apple silicon GPUs (Metal), from Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["arrow", "metal", "gpu", "apple-silicon", "columnar", "pyarrow"]
dependencies = ["pyarrow>=14"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Swift",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# None of these are hard dependencies: `import arrowmetal` imports only pyarrow, and each bridge
# module loads its dataframe library on first use.
# The Polars bridge and the .arrowmetal namespaces (docs/POLARS.md).
polars = ["polars>=1.0"]
# The DuckDB bridge: replacement scans and the Arrow hand-off (docs/DUCKDB.md).
duckdb = ["duckdb>=1.0"]
# The pandas bridge, the .am accessor and accel mode (docs/PANDAS.md).
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/arrowmetal/ArrowMetal"
Source = "https://github.com/arrowmetal/ArrowMetal"

[tool.setuptools.dynamic]
version = { attr = "arrowmetal.__version__" }

[tool.setuptools]
# The wheel is not pure Python: it carries a compiled arm64 dylib, so it must not be tagged
# `py3-none-any`. python/build_wheel.sh passes the macOS arm64 platform tag.
zip-safe = false

[tool.setuptools.packages.find]
include = ["arrowmetal*"]
namespaces = false

[tool.setuptools.package-data]
# build_wheel.sh copies .build/release/libArrowMetalC.dylib here before building.
arrowmetal = ["_lib/*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
