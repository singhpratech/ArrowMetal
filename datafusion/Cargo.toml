# ArrowMetal as a DataFusion physical optimizer rule: a spike.
#
# Its own workspace, like rust/ and polars-plugin/, so the DataFusion dependency tree stays out of
# the plain Rust binding's build.
[workspace]

[package]
name = "datafusion-arrowmetal"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/singhpratech/ArrowMetal"
rust-version = "1.85"
description = "Spike: ArrowMetal as a DataFusion physical optimizer rule on Apple silicon GPUs"
publish = false
build = "build.rs"

[dependencies]
arrowmetal = { path = "../rust/arrowmetal" }
# datafusion 55.1.0 depends on arrow ^59.2.0: the same arrow-rs major as the arrowmetal crate, so
# RecordBatches pass between the two with no bridge.
datafusion = { version = "55.1.0", default-features = false, features = ["sql"] }
arrow = { version = "59", default-features = false, features = ["ffi"] }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.9"
# The benchmark (examples/bench.rs) registers Parquet files; the library itself stays without it.
datafusion = { version = "55.1.0", default-features = false, features = ["sql", "parquet"] }
libc = "0.2"

# examples/bench.rs is timed from a release build with thin LTO.
[profile.release]
lto = "thin"
